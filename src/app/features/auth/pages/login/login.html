<div class="max-w-md mx-auto mt-20 p-6 bg-white shadow rounded">
  <h1 class="text-2xl font-semibold mb-4">Iniciar sesión</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="w-full mb-4">
      <mat-label>Email</mat-label> <input matInput formControlName="email" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-full mb-4">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password" />
    </mat-form-field>
    <button mat-raised-button color="primary" class="w-full">Entrar</button>
  </form>
</div>
